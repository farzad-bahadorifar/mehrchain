name: Build & Release Android APK

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      publish_release:
        description: 'Publish official GitHub Release with downloadable APK'
        required: false
        type: boolean
        default: false
      version_tag:
        description: 'Release Tag Name (e.g. v0.9.0-preview)'
        required: false
        type: string
        default: 'v0.9.0-preview'

permissions:
  contents: write

jobs:
  build-apk:
    name: 📱 Build & Package Android APK
    runs-on: ubuntu-latest

    steps:
      - name: 🛎️ Checkout Repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js 22 (LTS)
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: ☕ Setup Java 21 (Temurin)
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: 📦 Install Node Dependencies
        run: npm ci --legacy-peer-deps

      - name: 🧬 Generate Prisma Client
        run: npx prisma generate --schema=apps/mehrchain-backend/prisma/schema.prisma || true

      - name: 🧪 Run Frontend Automated Tests
        run: npx nx test mehrchain-frontend

      - name: 🛠️ Build Web App & Sync Capacitor Assets
        run: npm run mobile:build

      - name: 📱 Accept Android SDK Licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: 🤖 Build Android APK (Debug)
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace
          # Copy to clean name for release attachment
          cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/mehrchain.apk

      - name: 🚀 Upload APK Artifact (Internal Build)
        uses: actions/upload-artifact@v4
        with:
          name: mehrchain-debug-apk
          path: android/app/build/outputs/apk/debug/mehrchain.apk
          retention-days: 14

      - name: 🏷️ Publish Official GitHub Release (Only on Tags or Manual Request)
        if: startsWith(github.ref, 'refs/tags/v') || inputs.publish_release == true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || inputs.version_tag }}
          name: MehrChain ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || inputs.version_tag }}
          files: |
            android/app/build/outputs/apk/debug/mehrchain.apk
          draft: false
          prerelease: true
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
