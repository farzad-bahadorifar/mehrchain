name: Build & Release Android APK

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      sign_candidate:
        description: Build a same-key tester APK artifact without publishing a release
        type: boolean
        default: false
      publish_release:
        description: Publish a verified signed APK
        type: boolean
        default: false
      version_tag:
        description: Must match app-version.json (e.g. v1.0.0-rc.6)
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-apk:
    runs-on: ubuntu-latest
    env:
      NX_DAEMON: 'false'
      GOOGLE_CLIENT_ID: ${{ vars.GOOGLE_CLIENT_ID || '367374125567-qp8ooa1rrak6o49qs9sn8l9doiefrq76.apps.googleusercontent.com' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - run: npm ci --legacy-peer-deps
      - name: Validate shared version metadata
        id: version
        env:
          RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || inputs.version_tag }}
        run: node scripts/android-release.cjs validate "$RELEASE_TAG"
      - run: node --test scripts/release-policy.test.mjs scripts/android-release.test.cjs scripts/pages-api.test.mjs
      - run: npx prisma generate --schema=apps/mehrchain-backend/prisma/schema.prisma
      - run: npx nx test mehrchain-backend --skip-nx-cache
      - run: npx nx test mehrchain-frontend --watch=false --skip-nx-cache
      - name: Build web and sync Android
        run: |
          npx nx build mehrchain-frontend --skip-nx-cache
          npx cap sync android
      - name: Accept Android SDK licenses
        shell: bash
        run: |
          set +o pipefail
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses
          result=${PIPESTATUS[1]}
          exit "$result"
      - name: Build debug and unsigned release for validation
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug assembleRelease --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: mehrchain-debug-ci
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Sign Android APK
    if: (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && (inputs.publish_release == true || inputs.sign_candidate == true))
    needs: build-apk
    runs-on: ubuntu-latest
    # Official signing is confined to the canonical repository and release environment.
    environment: android-release
    permissions:
      contents: write
    concurrency:
      group: android-official-publication
      cancel-in-progress: false
    env:
      NX_DAEMON: 'false'
      GOOGLE_CLIENT_ID: ${{ vars.GOOGLE_CLIENT_ID || '367374125567-qp8ooa1rrak6o49qs9sn8l9doiefrq76.apps.googleusercontent.com' }}
      ANDROID_SIGNING_CERT_SHA256: ${{ vars.ANDROID_SIGNING_CERT_SHA256 }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Require canonical release identity
        env:
          REPOSITORY: ${{ github.repository }}
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          CANDIDATE_ONLY: ${{ inputs.sign_candidate }}
          PUBLISH_RELEASE: ${{ inputs.publish_release }}
        run: |
          test "$REPOSITORY" = 'farzad-bahadorifar/mehrchain'
          git merge-base --is-ancestor HEAD origin/main
          if [ "$CANDIDATE_ONLY" = true ] && [ "$PUBLISH_RELEASE" = true ]; then
            echo 'Choose either sign_candidate or publish_release, not both.'
            exit 1
          fi
          test -n "$KEYSTORE"
          test -n "$STORE_PASSWORD"
          test -n "$KEY_ALIAS"
          test -n "$KEY_PASSWORD"
          test -n "$ANDROID_SIGNING_CERT_SHA256"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - run: npm ci --legacy-peer-deps
      - name: Validate tag and increasing versionCode
        id: version
        env:
          RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || inputs.version_tag }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
        run: |
          node scripts/android-release.cjs validate "$RELEASE_TAG"
          node scripts/android-release.cjs publication "$RELEASE_TAG" "$REPOSITORY"
      - name: Build the checked-out revision
        run: |
          npx nx build mehrchain-frontend --skip-nx-cache
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace
      - name: Sign and verify the official APK
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077
          trap 'rm -f "$RUNNER_TEMP/release.keystore" "$RUNNER_TEMP/aligned.apk"' EXIT
          printf '%s' "$KEYSTORE" | base64 --decode > "$RUNNER_TEMP/release.keystore"
          TOOLS=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)
          mkdir -p dist/apk
          "$TOOLS/zipalign" -p 4 android/app/build/outputs/apk/release/app-release-unsigned.apk "$RUNNER_TEMP/aligned.apk"
          "$TOOLS/apksigner" sign --ks "$RUNNER_TEMP/release.keystore" --ks-pass env:KEYSTORE_PASSWORD \
            --ks-key-alias "$KEY_ALIAS" --key-pass env:KEY_PASSWORD \
            --out dist/apk/mehrchain-release.apk "$RUNNER_TEMP/aligned.apk"
          node scripts/android-release.cjs verify dist/apk/mehrchain-release.apk "$TOOLS" "$ANDROID_HOME/cmdline-tools/latest/bin/apkanalyzer"
      - name: Enable emulator acceleration for candidate testing
        if: inputs.sign_candidate == true
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Verify candidate installs next to the legacy APK
        if: inputs.sign_candidate == true
        uses: ReactiveCircus/android-emulator-runner@4c44018e59b437e86cdfc41da381398f93ed8808 # v2
        timeout-minutes: 15
        with:
          api-level: 35
          arch: x86_64
          disable-animations: true
          script: bash scripts/android-candidate-smoke.sh dist/apk/mehrchain-release.apk
      - name: Publish verified assets
        if: (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) || (github.event_name == 'workflow_dispatch' && inputs.publish_release == true)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: MehrChain ${{ steps.version.outputs.tag }}
          files: |
            dist/apk/mehrchain-release.apk
            dist/apk/release-manifest.json
            dist/apk/SHA256SUMS
          fail_on_unmatched_files: true
          draft: false
          prerelease: ${{ steps.version.outputs.prerelease == 'true' }}
          make_latest: ${{ steps.version.outputs.prerelease == 'true' && 'false' || 'true' }}
          generate_release_notes: true
      - name: Upload signed candidate without publishing
        if: github.event_name == 'workflow_dispatch' && inputs.sign_candidate == true && inputs.publish_release != true
        uses: actions/upload-artifact@v4
        with:
          name: mehrchain-signed-candidate-${{ steps.version.outputs.tag }}
          path: |
            dist/apk/mehrchain-release.apk
            dist/apk/release-manifest.json
            dist/apk/SHA256SUMS
          if-no-files-found: error
          retention-days: 14
