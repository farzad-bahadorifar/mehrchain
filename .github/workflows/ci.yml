name: CI Test Suite

on:
  push:
    branches:
      - main
      - T72
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: 🧪 Automated Test Suite (Frontend & Backend)
    runs-on: ubuntu-latest

    steps:
      - name: 🛎️ Checkout Repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js 22 (LTS)
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: 📦 Install Node Dependencies
        run: npm ci --legacy-peer-deps

      - name: 🧬 Generate Prisma Client
        run: npx prisma generate --schema=apps/mehrchain-backend/prisma/schema.prisma

      - name: 🧪 Run Backend Tests (Jest)
        run: npx nx test mehrchain-backend

      - name: 🧪 Run Frontend Tests (Vitest)
        run: npx nx test mehrchain-frontend

      - name: Test Pages API routing
        run: node --test scripts/pages-api.test.mjs

  backend-container:
    name: Backend container smoke
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://postgres:container-fixture@127.0.0.1:15432/mehrchain
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: mehrchain
          POSTGRES_PASSWORD: container-fixture
        ports:
          - 15432:5432
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --legacy-peer-deps
      - run: node scripts/release-migrate.cjs deploy
      - name: Build and start the portable backend
        run: |
          docker build --build-arg NF_GIT_SHA="$GITHUB_SHA" \
            -f apps/mehrchain-backend/Dockerfile -t mehrchain-backend:smoke .
          docker run -d --name mehrchain-api --network host -e DATABASE_URL \
            -e JWT_SECRET=container-smoke-test-fixture mehrchain-backend:smoke
          curl --fail-with-body --show-error --silent --retry 20 --retry-connrefused \
            --retry-delay 1 --max-time 5 http://localhost:3000/api/version | jq -e --arg sha "$GITHUB_SHA" '.revision == $sha'
      - name: Verify the auth endpoint is reachable
        run: |
          code=$(curl --show-error --silent --max-time 10 --output /dev/null --write-out '%{http_code}' \
            -H 'Content-Type: application/json' -d '{"email":"fixture@example.invalid","password":"fixture-password"}' \
            http://localhost:3000/api/auth/login)
          test "$code" = 401
          docker exec -i mehrchain-api node <<'NODE'
          const { PrismaClient } = require('@prisma/client');
          const bcrypt = require('bcryptjs');
          const prisma = new PrismaClient();
          (async () => {
            try {
              await prisma.user.create({ data: {
                email: 'fixture@example.invalid', name: 'Container fixture',
                passwordHash: await bcrypt.hash('fixture-password', 10),
                passwordSetAt: new Date(), isEmailVerified: true,
              } });
            } finally {
              await prisma.$disconnect();
            }
          })().catch(() => { process.exitCode = 1; });
          NODE
          token=$(curl --fail-with-body --show-error --silent --max-time 10 \
            -H 'Content-Type: application/json' -d '{"email":"fixture@example.invalid","password":"fixture-password"}' \
            http://localhost:3000/api/auth/login | jq -er '.accessToken')
          curl --fail-with-body --show-error --silent --max-time 10 -H "Authorization: Bearer $token" \
            http://localhost:3000/api/auth/me | jq -e '.email == "fixture@example.invalid"'
      - name: Read fixture container logs on failure
        if: failure()
        run: docker logs mehrchain-api || true
