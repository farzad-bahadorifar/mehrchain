<div
  class="mero-frame relative inline-flex items-center justify-center select-none"
  [ngClass]="sizeClasses()"
  [attr.data-size]="size()"
  [class.mero--ready]="ready()"
  role="img"
  [attr.aria-label]="
    renderState() === 'unavailable'
      ? 'Mero, temporarily unavailable'
      : mood() === 'sad'
        ? 'Mero, feeling sad'
        : 'Mero, smiling'
  "
>
  @if (showGlow()) {
    <div class="mero-belly-glow" [style.background]="effectiveGradient()"></div>
  }

  @if (renderState() === 'unavailable') {
    <span class="absolute text-xs text-muted-foreground" aria-hidden="true">Mero</span>
  }
  <canvas
    #canvas
    class="mero-canvas"
    [class.mero-canvas--ready]="ready()"
    aria-hidden="true"
  ></canvas>
  <div #lightHandle class="mero-light-handle" aria-hidden="true"></div>
</div>
