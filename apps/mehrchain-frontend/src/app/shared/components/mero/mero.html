<div
  class="relative inline-flex items-center justify-center select-none transition-transform duration-200"
  [ngClass]="sizeClasses()"
  [class.cursor-pointer]="interactive()"
  [class.active:scale-95]="interactive()"
  (click)="handleClick($event)"
>
  <!-- Warm Belly Glow Light -->
  @if (showGlow()) {
    <div
      class="mero-belly-glow"
      [class.glow-celebrate]="effectiveState() === 'celebrating'"
      [class.glow-dim]="effectiveState() === 'sleepy'"
    ></div>
  }

  <!-- Physical Mascot Body Container with Motion States -->
  <div
    class="relative w-full h-full flex items-center justify-center transform-gpu"
    [class.mero-floating]="floating() && effectiveState() !== 'celebrating' && effectiveState() !== 'sleepy'"
    [class.mero-celebrating]="effectiveState() === 'celebrating'"
    [class.mero-sleepy]="effectiveState() === 'sleepy'"
    [class.mero-squished]="isSquished()"
  >
    <!-- Base 3D Mascot Image -->
    <img
      src="assets/mero.png"
      alt="Mero Mascot"
      class="w-full h-full object-contain relative z-10 pointer-events-none select-none drop-shadow-sm transition-all duration-300"
    />
  </div>
</div>
