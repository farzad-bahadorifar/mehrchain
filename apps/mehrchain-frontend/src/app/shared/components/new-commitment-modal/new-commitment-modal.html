<div class="fixed inset-0 z-50 flex items-end justify-center sm:items-center p-0 sm:p-4 text-left">
  <div
    class="absolute inset-0 bg-black/60 backdrop-blur-xs transition-opacity animate-fade-in"
    (click)="close.emit()"
  ></div>

  <div
    class="relative w-full max-w-md bg-white rounded-t-[2rem] sm:rounded-[2rem] p-6 shadow-2xl animate-slide-up ring-1 ring-black/5 overflow-hidden max-h-[85vh] overflow-y-auto custom-scrollbar"
  >
    <div class="w-12 h-1.5 bg-slate-200 rounded-full mx-auto mb-4 opacity-70"></div>

    <div class="flex items-center justify-between mb-5">
      <h2 class="text-lg font-bold text-slate-900">New Commitment ✨</h2>

      <button
        (click)="close.emit()"
        class="w-8 h-8 rounded-full bg-slate-100 flex items-center justify-center hover:bg-slate-200 transition-colors text-slate-500"
      >
        <lucide-icon name="x" class="w-4 h-4"></lucide-icon>
      </button>
    </div>

    <!-- Category Selector -->
    <div class="grid grid-cols-4 gap-2 mb-4">
      @for (cat of categories; track cat.id) {
        <button
          type="button"
          (click)="setCategory(cat.id)"
          class="flex flex-col items-center justify-center py-2.5 rounded-2xl border transition-all duration-200"
          [class]="
            category() === cat.id
              ? 'border-teal-600 bg-teal-50 text-teal-800 font-bold shadow-xs'
              : 'border-slate-200 text-slate-500 hover:bg-slate-50'
          "
        >
          <lucide-icon [name]="cat.icon" class="w-5 h-5 mb-1"></lucide-icon>
          <span class="text-[11px]">{{ cat.label }}</span>
        </button>
      }
    </div>

    <!-- Habit Title -->
    <div class="mb-4">
      <label class="block text-xs font-bold text-slate-700 mb-1.5">Habit Title:</label>
      <input
        type="text"
        [(ngModel)]="title"
        class="w-full bg-slate-50 rounded-2xl p-3 text-slate-800 placeholder:text-slate-400 border border-slate-200 focus:border-teal-600 focus:bg-white focus:outline-none text-sm font-medium transition-all"
        placeholder="e.g. Drink water after waking up"
      />

      <!-- Quick suggestions -->
      <div class="flex gap-1.5 mt-2 overflow-x-auto pb-1 scrollbar-hide">
        @for (s of suggestions; track s) {
          <button
            type="button"
            (click)="selectSuggestion(s)"
            class="px-2.5 py-1 rounded-lg bg-slate-100 text-[11px] font-medium text-slate-600 border border-transparent hover:border-teal-300 hover:text-teal-700 hover:bg-teal-50 transition-all whitespace-nowrap"
          >
            {{ s }}
          </button>
        }
      </div>
    </div>

    <!-- Why -->
    <div class="mb-4">
      <label class="block text-xs font-bold text-slate-700 mb-1">Your Purpose (Why):</label>
      <textarea
        [(ngModel)]="why"
        rows="2"
        class="w-full bg-slate-50 rounded-2xl p-2.5 text-slate-800 placeholder:text-slate-400 border border-slate-200 focus:border-teal-600 focus:bg-white focus:outline-none text-xs leading-relaxed resize-none transition-all"
        placeholder="The intention that keeps you consistent..."
      ></textarea>
    </div>

    <!-- Duration -->
    <div class="mb-4">
      <label class="block text-xs font-bold text-slate-700 mb-2">Duration:</label>
      <div class="grid grid-cols-4 gap-2">
        @for (d of [7, 14, 21]; track d) {
          <button
            type="button"
            (click)="duration.set(d); isCustomDuration.set(false)"
            class="py-2 rounded-xl text-xs font-bold transition-all border"
            [class]="
              duration() === d && !isCustomDuration()
                ? 'border-teal-700 bg-teal-700 text-white shadow-xs'
                : 'border-slate-200 text-slate-600 hover:bg-slate-50'
            "
          >
            {{ d }} Days
          </button>
        }

        @if (isCustomDuration()) {
          <div class="flex items-center justify-center p-0.5 rounded-xl border-2 border-teal-600 bg-white">
            <input
              #durInput
              type="number"
              class="w-full text-center font-bold text-xs outline-none bg-transparent py-1"
              placeholder="#"
              (keyup.enter)="confirmCustomDuration(durInput.value)"
              (blur)="confirmCustomDuration(durInput.value)"
              autoFocus
            />
          </div>
        } @else {
          <button
            type="button"
            (click)="toggleCustomDuration()"
            class="py-2 rounded-xl text-xs font-bold border border-slate-200 text-slate-500 hover:border-teal-600 hover:text-teal-700 hover:bg-white flex items-center justify-center gap-1"
          >
            <lucide-icon name="plus" class="w-3.5 h-3.5"></lucide-icon>
            <span>Custom</span>
          </button>
        }
      </div>
    </div>

    <!-- Daily Reminder Time -->
    <div class="mb-6">
      <label class="block text-xs font-bold text-slate-700 mb-1.5 flex items-center gap-1">
        <lucide-icon name="bell" class="w-3.5 h-3.5 text-teal-700"></lucide-icon>
        <span>Daily Reminder Time:</span>
      </label>
      <div class="flex items-center gap-2 bg-slate-50 border border-slate-200 rounded-xl p-2">
        <lucide-icon name="clock" class="w-4 h-4 text-slate-400"></lucide-icon>
        <input
          type="time"
          [(ngModel)]="reminderTime"
          class="bg-transparent text-xs font-bold text-slate-800 outline-none w-full cursor-pointer"
        />
      </div>
    </div>

    <!-- Submit Button -->
    <button
      type="button"
      (click)="handleSubmit()"
      [disabled]="title().length < 2"
      class="w-full bg-teal-700 hover:bg-teal-800 text-white py-3.5 rounded-2xl font-bold text-sm shadow-md shadow-teal-700/25 disabled:opacity-50 disabled:cursor-not-allowed transition-all active:scale-98 flex items-center justify-center gap-2"
    >
      <span>Light My Lamp</span>
      <lucide-icon name="sparkles" class="w-4 h-4"></lucide-icon>
    </button>
  </div>
</div>
