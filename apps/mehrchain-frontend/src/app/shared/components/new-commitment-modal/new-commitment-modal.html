<div class="fixed inset-0 z-50 flex items-end justify-center sm:items-center p-0 sm:p-4">
  <div
    class="absolute inset-0 bg-black/60 backdrop-blur-sm transition-opacity animate-fade-in"
    (click)="close.emit()"
  ></div>

  <div
    class="relative w-full max-w-md bg-card rounded-t-[2rem] sm:rounded-[2rem] p-6 shadow-2xl animate-slide-up ring-1 ring-border/50 overflow-hidden max-h-[85vh] overflow-y-auto custom-scrollbar border border-border/40"
  >
    <div class="w-12 h-1.5 bg-muted rounded-full mx-auto mb-6 opacity-60"></div>

    <div class="flex items-center justify-between mb-6">
      <h2 class="text-xl font-bold text-foreground">New Commitment</h2>

      <div class="flex items-center gap-2">
        <button
          type="button"
          (click)="isPublic.set(!isPublic())"
          class="w-8 h-8 rounded-full flex items-center justify-center transition-all border"
          [class]="
            isPublic()
              ? 'bg-blue-100 text-blue-600 border-blue-200 dark:bg-blue-950/60 dark:text-blue-400 dark:border-blue-800'
              : 'bg-muted text-muted-foreground border-border'
          "
        >
          <lucide-icon [name]="isPublic() ? 'globe' : 'lock'" class="w-4 h-4"></lucide-icon>
        </button>

        <button
          type="button"
          (click)="close.emit()"
          class="w-8 h-8 rounded-full bg-muted flex items-center justify-center hover:bg-muted/80 transition-colors text-muted-foreground"
        >
          <lucide-icon name="x" class="w-5 h-5"></lucide-icon>
        </button>
      </div>
    </div>

    <!-- Category selector -->
    <div class="flex gap-3 mb-6 overflow-x-auto pb-2 scrollbar-hide">
      @for (cat of categories; track cat.id) {
        <button
          type="button"
          (click)="category.set(cat.id)"
          class="flex flex-col items-center justify-center min-w-[70px] py-3 rounded-2xl border-2 transition-all duration-200"
          [class]="
            category() === cat.id
              ? 'border-primary bg-primary/10 text-primary shadow-sm'
              : 'border-border text-muted-foreground hover:border-primary/30 hover:bg-muted/50'
          "
        >
          <lucide-icon [name]="cat.icon" class="w-6 h-6 mb-1"></lucide-icon>
          <span class="text-[10px] font-bold">{{ cat.label }}</span>
        </button>
      }
    </div>

    <!-- Habit Title Textarea -->
    <div class="mb-4 relative">
      <textarea
        [(ngModel)]="title"
        class="w-full bg-muted/40 rounded-2xl p-4 text-foreground placeholder:text-muted-foreground/60 border border-border focus:border-primary focus:bg-card focus:outline-none resize-none transition-all h-24 text-base font-medium"
        placeholder="What is your new spark?"
      ></textarea>

      <div class="flex gap-2 mt-2 overflow-x-auto pb-1 scrollbar-hide">
        @for (s of suggestions; track s) {
          <button
            type="button"
            (click)="selectSuggestion(s)"
            class="px-3 py-1.5 rounded-lg bg-muted text-xs font-medium text-muted-foreground border border-border/40 hover:border-primary/30 hover:text-primary hover:bg-card transition-all whitespace-nowrap"
          >
            {{ s }}
          </button>
        }
      </div>
    </div>

    <!-- Why Textarea -->
    <div class="mb-4">
      <label class="block text-xs font-bold text-muted-foreground uppercase mb-1.5 ml-1">Why this matters?</label>
      <input
        type="text"
        [(ngModel)]="why"
        placeholder="Your deep intention..."
        class="w-full bg-muted/40 rounded-xl p-3 text-sm text-foreground placeholder:text-muted-foreground/60 border border-border focus:border-primary focus:bg-card focus:outline-none"
      />
    </div>

    <!-- Duration -->
    <div class="mb-4">
      <label class="block text-xs font-bold text-muted-foreground uppercase mb-2 ml-1">Duration</label>

      <div class="flex gap-2 overflow-x-auto pb-1 scrollbar-hide">
        @for (d of [7, 14, 21]; track d) {
          <button
            type="button"
            (click)="setStandardDuration(d)"
            class="flex-1 min-w-[50px] py-2.5 rounded-xl text-sm font-bold transition-all border-2"
            [class]="
              duration() === d && !isCustomDuration() && !isNonStandardDuration()
                ? 'border-primary bg-primary text-white shadow-md'
                : 'border-border text-muted-foreground hover:border-primary/30 hover:bg-muted/50'
            "
          >
            {{ d }}
          </button>
        }

        @if (isCustomDuration()) {
          <div
            class="flex-1 min-w-[50px] flex items-center justify-center p-0.5 rounded-xl border-2 border-primary bg-card animate-fade-in"
          >
            <input
              #durInput
              type="number"
              [value]="isNonStandardDuration() ? duration() : ''"
              class="w-full text-center font-bold text-sm outline-none bg-transparent h-full py-1 text-primary"
              placeholder="#"
              (input)="onCustomDurationInput(durInput.value)"
              (keyup.enter)="isCustomDuration.set(false)"
              autoFocus
            />
          </div>
        } @else if (isNonStandardDuration()) {
          <button
            type="button"
            (click)="toggleCustomDuration()"
            class="flex-1 min-w-[50px] py-2.5 rounded-xl text-sm font-bold transition-all border-2 border-primary bg-primary text-white shadow-md flex items-center justify-center gap-1"
          >
            <span>{{ duration() }}</span>
            <span class="text-[10px] uppercase">Days</span>
          </button>
        } @else {
          <button
            type="button"
            (click)="toggleCustomDuration()"
            class="flex-1 min-w-[50px] py-2.5 rounded-xl text-sm font-bold transition-all border-2 border-border text-muted-foreground hover:border-primary hover:text-primary hover:bg-card flex items-center justify-center"
          >
            <lucide-icon name="plus" class="w-4 h-4"></lucide-icon>
          </button>
        }
      </div>
    </div>

    <!-- Reminder Time -->
    <div class="mb-6 flex items-center justify-between p-3 rounded-2xl bg-muted/40 border border-border/40">
      <span class="text-xs font-semibold text-foreground flex items-center gap-1.5">
        <lucide-icon name="bell" class="w-4 h-4 text-primary"></lucide-icon>
        <span>Reminder Time:</span>
      </span>
      <input
        type="time"
        [(ngModel)]="reminderTime"
        class="bg-card border border-border rounded-xl px-2.5 py-1 text-xs font-bold text-foreground outline-none cursor-pointer"
      />
    </div>

    <!-- Submit Button -->
    <button
      (click)="handleSubmit()"
      class="w-full bg-primary text-primary-foreground py-4 rounded-2xl font-bold text-base shadow-lg shadow-primary/20 hover:bg-accent hover:scale-[1.02] active:scale-95 transition-all duration-200 flex items-center justify-center gap-2"
    >
      <span>Start Journey</span>
      <lucide-icon name="sparkles" class="w-5 h-5"></lucide-icon>
    </button>
  </div>
</div>
