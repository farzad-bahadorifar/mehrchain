<div class="animate-fade-in h-full flex flex-col">
  <h2 class="text-2xl font-bold mb-6 text-center text-foreground">
    Where do you want to shine?
  </h2>

  <div class="grid grid-cols-2 gap-4 flex-1">
    @for (cat of categories(); track cat.id) {
      <button
        (click)="categorySelected.emit(cat.id)"
        class="flex flex-col items-center justify-center p-4 rounded-2xl border-2 border-transparent bg-muted/50 hover:bg-card hover:border-primary/30 hover:shadow-md transition-all duration-300 group active:scale-95 aspect-square"
      >
        <div
          [class]="
            'w-14 h-14 rounded-full flex items-center justify-center mb-3 transition-transform group-hover:scale-110 ' +
            cat.bg
          "
        >
          <lucide-icon [name]="cat.icon" [class]="'w-7 h-7 ' + cat.color"></lucide-icon>
        </div>

        <span
          class="font-semibold text-foreground group-hover:text-primary transition-colors"
          >{{ cat.label }}</span
        >
      </button>
    }
  </div>
</div>
