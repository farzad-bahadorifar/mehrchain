<div class="animate-fade-in h-full flex flex-col justify-between space-y-4">
  <div>
    <h2 class="text-2xl font-bold mb-4 text-center text-foreground">
      Commit for how long?
    </h2>

    <div class="grid grid-cols-2 gap-2.5 mb-2">
      <!-- Endless Journey Option -->
      <button
        type="button"
        (click)="endlessDurationSelected.emit()"
        class="flex items-center justify-center gap-2 py-3 px-3 rounded-2xl border-2 transition-all duration-300 text-xs font-bold"
        [class]="
          !isCustomDuration() && selectedDuration() === -1
            ? 'border-primary bg-primary/10 text-primary shadow-sm ring-1 ring-primary/30'
            : 'border-border text-muted-foreground hover:border-primary/30 hover:bg-muted/50'
        "
      >
        <lucide-icon name="sparkles" class="w-4 h-4 text-primary"></lucide-icon>
        <span>Endless Journey</span>
      </button>

      <!-- Custom Duration Option -->
      @if (isCustomDuration()) {
        <div
          class="flex items-center justify-center p-1 rounded-2xl border-2 transition-all animate-fade-in"
          [class]="
            !isDurationValid()
              ? 'border-red-500 bg-red-500/10 ring-2 ring-red-500/20 text-red-500'
              : 'border-primary bg-card text-primary'
          "
        >
          <input
            #durInput
            type="text"
            inputmode="numeric"
            pattern="[1-9][0-9]*"
            [value]="customDurationText()"
            class="w-full text-center font-bold text-xs outline-none bg-transparent transition-colors"
            [class]="!isDurationValid() ? 'text-red-500 placeholder:text-red-400/50' : 'text-primary'"
            placeholder="e.g. 21"
            (keydown)="onDurationKeydown($event)"
            (input)="customDurationChanged.emit(durInput.value)"
            autoFocus
          />
        </div>
      } @else {
        <button
          type="button"
          (click)="openCustom.emit()"
          class="flex items-center justify-center gap-1.5 py-3 px-3 rounded-2xl border-2 border-border text-muted-foreground hover:border-primary/50 hover:text-primary transition-all text-xs font-bold"
          [class]="
            selectedDuration() > 0 && isCustomDuration()
              ? 'border-primary bg-primary/10 text-primary shadow-sm'
              : 'border-border text-muted-foreground hover:border-primary/30 hover:bg-muted/50'
          "
        >
          <lucide-icon name="calendar" class="w-4 h-4"></lucide-icon>
          <span>Custom Days</span>
        </button>
      }
    </div>

    @if (isCustomDuration() && !isDurationValid()) {
      <p class="text-xs text-red-500 text-center mb-3 font-medium animate-fade-in">
        {{ durationErrorMessage() || 'Duration must be at least 1 day' }}
      </p>
    } @else {
      <div class="mb-3"></div>
    }

    <!-- Why Textarea -->
    <div
      class="bg-gradient-to-br from-primary/5 to-accent/5 p-3.5 rounded-2xl border border-primary/10 flex gap-3 mb-2.5"
    >
      <lucide-icon name="sparkles" class="w-4 h-4 text-primary shrink-0 mt-0.5"></lucide-icon>
      <div class="w-full">
        <span class="font-bold text-foreground block mb-1 text-xs">Why this matters?</span>
        <textarea
          [value]="whyText()"
          (input)="whyTextChanged.emit($any($event.target).value)"
          class="w-full bg-transparent text-xs text-muted-foreground resize-none focus:outline-none border-b border-primary/20 focus:border-primary h-10"
          placeholder="Write your reason..."
        ></textarea>
      </div>
    </div>

    <!-- Daily Phone Reminder Time -->
    <div class="p-3 rounded-2xl bg-muted/40 border border-border/40 flex items-center justify-between mb-2">
      <div class="flex items-center gap-2 text-xs font-semibold text-foreground">
        <lucide-icon name="bell" class="w-4 h-4 text-primary"></lucide-icon>
        <span>Daily Reminder:</span>
      </div>
      <input
        #timeInput
        type="time"
        [value]="reminderTime()"
        (change)="reminderTimeChanged.emit(timeInput.value)"
        class="bg-card border border-border/70 rounded-xl px-2.5 py-1 text-xs font-bold text-foreground outline-none cursor-pointer"
      />
    </div>

    <!-- Public / Chain Shareable Toggle -->
    <div
      (click)="isPublicChanged.emit(!isPublic())"
      class="p-3 rounded-2xl bg-muted/40 border border-border/40 flex items-center justify-between cursor-pointer hover:border-primary/40 transition-all select-none"
    >
      <div class="flex items-center gap-2.5">
        <div
          class="w-7 h-7 rounded-xl flex items-center justify-center transition-colors"
          [class]="isPublic() ? 'bg-primary/20 text-primary' : 'bg-muted text-muted-foreground'"
        >
          <lucide-icon name="link-2" class="w-4 h-4"></lucide-icon>
        </div>
        <div>
          <span class="text-xs font-bold text-foreground block">Share in Chain</span>
          <span class="text-[10px] text-muted-foreground block">Allow linking with a partner</span>
        </div>
      </div>
      <div
        class="w-10 h-6 rounded-full transition-colors relative p-0.5"
        [class]="isPublic() ? 'bg-primary' : 'bg-muted-foreground/30'"
      >
        <div
          class="w-5 h-5 rounded-full bg-white shadow-xs transition-transform"
          [class]="isPublic() ? 'translate-x-4' : 'translate-x-0'"
        ></div>
      </div>
    </div>
  </div>

  <button
    (click)="isDurationValid() ? proceedToSignUp.emit() : null"
    [disabled]="!isDurationValid()"
    class="w-full bg-primary text-primary-foreground py-4 rounded-2xl font-bold text-lg shadow-lg shadow-primary/25 hover:bg-accent hover:scale-[1.02] active:scale-95 transition-all duration-300 flex items-center justify-center gap-2 mt-2 disabled:opacity-50 disabled:pointer-events-none disabled:cursor-not-allowed"
  >
    Continue to Save Progress <lucide-icon name="arrow-right" class="w-5 h-5"></lucide-icon>
  </button>
</div>
