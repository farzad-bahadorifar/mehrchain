<div class="animate-fade-in h-full flex flex-col justify-between space-y-4">
  <div>
    <h2 class="text-2xl font-bold text-center text-foreground mb-1">
      Save Your Progress
    </h2>
    <p class="text-xs text-muted-foreground text-center mb-5 max-w-xs mx-auto leading-relaxed">
      Create your profile to keep your streak glowing and access your habits anywhere.
    </p>

    @if (isDuplicateEmailError()) {
      <div class="p-4 mb-4 rounded-2xl bg-amber-500/10 border border-amber-500/30 text-amber-900 dark:text-amber-100 text-xs animate-slide-up shadow-sm">
        <div class="flex items-start gap-3">
          <div class="w-8 h-8 rounded-xl bg-amber-500/20 flex items-center justify-center text-amber-600 dark:text-amber-400 shrink-0 mt-0.5">
            <lucide-icon name="alert-circle" class="w-4 h-4"></lucide-icon>
          </div>
          <div class="space-y-2.5 flex-1">
            <div>
              <p class="font-bold text-foreground text-sm">
                Account Already Exists
              </p>
              <p class="text-muted-foreground text-xs leading-relaxed mt-0.5">
                This email is already registered. Would you like to sign in to your account?
              </p>
            </div>
            <div class="flex items-center gap-2 pt-0.5">
              <button
                type="button"
                (click)="switchToLogin.emit()"
                class="px-4 py-2 rounded-xl bg-primary text-primary-foreground font-bold text-xs hover:bg-accent transition-all shadow-md shadow-primary/20 active:scale-95 flex items-center gap-1.5 cursor-pointer"
              >
                <lucide-icon name="log-in" class="w-3.5 h-3.5"></lucide-icon>
                <span>Sign In Directly</span>
              </button>
              <button
                type="button"
                (click)="openLoginWithForgot.emit()"
                class="text-xs text-muted-foreground hover:text-primary font-medium transition-colors px-2 py-1"
              >
                Forgot Password?
              </button>
            </div>
          </div>
        </div>
      </div>
    } @else if (signUpError()) {
      <div class="p-3.5 mb-4 rounded-2xl bg-rose-500/10 border border-rose-500/20 text-rose-600 dark:text-rose-400 text-xs font-semibold text-center animate-shake">
        <span>{{ signUpError() }}</span>
      </div>
    }

    <div class="space-y-3">
      <div>
        <label class="block text-xs font-bold text-muted-foreground uppercase mb-1 ml-1 flex justify-between">
          <span>Username</span>
          <span class="text-[10px] text-teal-600 dark:text-teal-400 font-semibold lowercase">Unique ID (3-20 chars)</span>
        </label>
        <div class="relative flex items-center">
          <span class="absolute left-4 font-bold text-sm text-teal-600 dark:text-teal-400 select-none pointer-events-none">&#64;</span>
          <input
            type="text"
            [value]="signUpUsername()"
            (input)="usernameChange.emit($any($event.target).value)"
            placeholder="your_username"
            autocomplete="username"
            autocapitalize="none"
            class="w-full bg-muted/40 rounded-xl py-3.5 pl-10 pr-4 text-sm text-foreground border border-border focus:border-primary focus:bg-card focus:outline-none transition-colors font-medium"
          />
        </div>
      </div>

      <div>
        <label class="block text-xs font-bold text-muted-foreground uppercase mb-1 ml-1">Email</label>
        <div class="relative flex items-center">
          <lucide-icon name="mail" class="w-4 h-4 text-muted-foreground absolute left-4 pointer-events-none"></lucide-icon>
          <input
            type="email"
            [value]="signUpEmail()"
            (input)="emailChange.emit($any($event.target).value)"
            placeholder="you@example.com"
            class="w-full bg-muted/40 rounded-xl py-3.5 pl-14 pr-4 text-sm text-foreground border border-border focus:border-primary focus:bg-card focus:outline-none transition-colors"
          />
        </div>
      </div>

      <div>
        <label class="block text-xs font-bold text-muted-foreground uppercase mb-1 ml-1">Password</label>
        <div class="relative flex items-center">
          <lucide-icon name="lock" class="w-4 h-4 text-muted-foreground absolute left-4 pointer-events-none"></lucide-icon>
          <input
            [type]="showSignUpPassword() ? 'text' : 'password'"
            [value]="signUpPassword()"
            (input)="passwordChange.emit($any($event.target).value)"
            placeholder="At least 6 characters"
            class="w-full bg-muted/40 rounded-xl py-3.5 pl-14 pr-11 text-sm text-foreground border border-border focus:border-primary focus:bg-card focus:outline-none transition-colors"
            (keyup.enter)="signUp.emit()"
          />
          <button
            type="button"
            (click)="togglePassword.emit()"
            class="absolute right-3.5 p-1 text-muted-foreground hover:text-foreground transition-colors"
            title="Toggle password visibility"
          >
            <lucide-icon [name]="showSignUpPassword() ? 'eye-off' : 'eye'" class="w-4 h-4"></lucide-icon>
          </button>
        </div>
      </div>
    </div>
  </div>

  <div class="pt-2">
    <button
      (click)="signUp.emit()"
      class="w-full bg-primary text-primary-foreground py-4 rounded-2xl font-bold text-lg shadow-lg shadow-primary/25 hover:bg-accent hover:scale-[1.02] active:scale-95 transition-all duration-300 flex items-center justify-center gap-2"
    >
      Create Account &amp; Light Lamp <lucide-icon name="sparkles" class="w-5 h-5"></lucide-icon>
    </button>
  </div>
</div>
